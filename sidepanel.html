<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GuideMe</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <h1>GuideMe</h1>
  <label for="goal">What do you want to do?</label>

  <script src="env.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
