<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GuideMe Options</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <h1>GuideMe Options</h1>
  <label for="key">Gemini API key</label>
  <input id="key" type="password" placeholder="Paste your API key" autocomplete="off">
  <button id="save">Save</button>
  <div id="status"></div>
  <p>The key is stored only in this browser (chrome.storage.local).</p>
  <script src="options.js"></script>
</body>
</html>
